{% extends "base.html" %}

{% block content %}

<h2>Connexion</h2>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <p class="flash flash-{{ category }}">{{ message }}</p>
  {% endfor %}
{% endwith %}

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="text" name="username" placeholder="Nom utilisateur" required>
    <input type="password" name="password" placeholder="Mot de passe" required>
    <button type="submit">Connexion</button>
</form>

<p><a href="{{ url_for('main.mot_de_passe_oublie') }}">Mot de passe oublié ?</a></p>
<a href="{{ url_for('main.register') }}">Créer un compte</a>

{% endblock %}
