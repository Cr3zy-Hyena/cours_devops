{% extends "base.html" %}

{% block content %}

<h2>Nouveau mot de passe</h2>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <p class="flash flash-{{ category }}">{{ message }}</p>
  {% endfor %}
{% endwith %}

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="password" name="password" placeholder="Nouveau mot de passe (8 min.)" required>
    <input type="password" name="confirm_password" placeholder="Confirmer" required>
    <button type="submit">Enregistrer</button>
</form>

<a href="{{ url_for('main.login') }}">← Retour à la connexion</a>

{% endblock %}
